specVersion: 1.0.0
description: >
  Vault402 PurchaseLog subgraph — Ethereum Sepolia. New this event (Graph
  "Start Fresh" pool). PLACEHOLDER: address/startBlock not yet set (contract
  not deployed).
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PurchaseLog
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # TODO: fill in after deploy
      abi: PurchaseLog
      startBlock: 0 # TODO: fill in after deploy
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Purchase
        - Item
        - Vendor
      abis:
        - name: PurchaseLog
          file: ../contracts/PurchaseLog.json # TODO: generate ABI after compiling contract
      eventHandlers:
        - event: PurchaseRecorded(indexed address,string,uint256,uint256,string,uint256)
          handler: handlePurchaseRecorded
      file: ./src/mapping.ts
