specVersion: 1.0.0
description: >
  Vault402 PurchaseLog subgraph — Ethereum Sepolia. New this event (Graph
  "Start Fresh" pool). address/startBlock are patched in by
  scripts/deploy-purchase-log.ts after a real deploy — do not hand-edit
  the placeholders below except to confirm a deploy hasn't run yet.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PurchaseLog
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # TODO: fill in after deploy
      abi: PurchaseLog
      startBlock: 0 # TODO: fill in after deploy
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Purchase
        - Item
        - Vendor
      abis:
        - name: PurchaseLog
          file: ../contracts/artifacts/PurchaseLog.json # written by npm run contracts:compile
      eventHandlers:
        # Event shape is unchanged (recordPurchase's new `timestamp` param feeds the
        # existing event field, doesn't add one) — see contracts/PurchaseLog.sol.
        - event: PurchaseRecorded(indexed address,string,uint256,uint256,string,uint256)
          handler: handlePurchaseRecorded
      file: ./src/mapping.ts
