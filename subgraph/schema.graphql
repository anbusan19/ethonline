# Vault402 subgraph schema — Ethereum Sepolia (new this event, Graph "Start Fresh" pool).
# Entities match PurchaseLog's real PurchaseRecorded event (contracts/PurchaseLog.sol)
# and subgraph/src/mapping.ts's handler.

type Purchase @entity(immutable: true) {
  id: ID!
  buyer: Bytes!
  item: Item!
  vendor: Vendor!
  quantity: BigInt!
  price: BigInt!
  timestamp: BigInt!
}

type Item @entity(immutable: false) {
  id: ID!
  name: String!
  purchases: [Purchase!]! @derivedFrom(field: "item")
}

type Vendor @entity(immutable: false) {
  id: ID!
  name: String!
  purchases: [Purchase!]! @derivedFrom(field: "vendor")
}

# Shared shape if multiple vendor sources are wired in — not yet written by the
# mapping (see README's "Restock & price-comparison flow in detail").
type PriceQuote @entity(immutable: false) {
  id: ID!
  vendor: Vendor!
  item: Item!
  price: BigInt!
  timestamp: BigInt!
}
